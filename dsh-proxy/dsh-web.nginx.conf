# dsh Web reverse proxy with cookie authentication in front of the loopback dsh server.
# The public listener must terminate TLS before this configuration is exposed outside localhost.

upstream dsh_backend {
    server 127.0.0.1:3081;
}

upstream dsh_auth {
    server 127.0.0.1:3082;
}

server {
    listen 0.0.0.0:3080;
    server_name _;
    absolute_redirect off;
    client_max_body_size 300m;

    # The auth probe is internal so clients cannot bypass the public login route.
    location = /_auth {
        internal;
        proxy_pass http://dsh_auth/_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location = /login {
        proxy_pass http://dsh_auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nginx authenticates the browser cookie, then overwrites the assertion before
    # forwarding the request to dsh's loopback listener.
    location /api/ {
        auth_request /_auth;
        error_page 401 = @login_redirect;

        proxy_pass http://dsh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3081;
        proxy_set_header Origin http://127.0.0.1:3081;
        proxy_set_header X-Dsh-Proxy-Auth 1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @login_redirect;

        proxy_pass http://dsh_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Dsh-Proxy-Auth 1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location @login_redirect {
        return 302 /login?next=$uri;
    }
}
